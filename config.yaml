database:
  path: "epg.db"

server:
  host: "0.0.0.0"
  port: 8080
  debug: false
  cors_enabled: false

retention:
  days: 7

scheduler:
  import_time: "03:00"
  timezone: "UTC"

# Export settings - nested to match config.py and jobs.py
export:
  enabled: true
  time: "05:00"
  dir: "/tmp/epg_exports"

logging:
  level: "INFO"
  format: "text"

ultimate_backend:
  enabled: true
  instance:
    name: "main"
    base_url: "http://your-ultimate-backend:7777"
    api_key: "your-api-key-if-needed"
  import:
    future_days: 3
    past_days: 7
    chunk_hours: 24
    max_requests_per_second: 5
    max_concurrent_channels: 3
    api_max_future_days: 3
  grid_import:
    chunk_hours: 3
    days_ahead: 7
  detail_enrichment:
    max_days: 7
    max_attempts: 3
    batch_limit: 5000
  discovery:
    enabled: true
    day: 6
    hour: 2